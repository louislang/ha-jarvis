[workspace]
members = ["xtask"]

[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
async-openai = { version = "0.43.0", default-features = false, features = ["responses", "rustls"] }
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
jiff = { version = "0.2.38", features = ["serde"] }
minijinja = { version = "3.0.5", features = ["serde"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic", "cuda"] }
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
rand_distr = "0.6.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
tempfile = "3.27.0"
text-processing-rs = "0.2.2"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tracing = "0.1.44"
unicode-normalization = "0.1.26"
vstd = "=0.0.0-2026-10-25-0158"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
dashmap = "6.2.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[package.metadata.verus]
verify = true

[lints]
workspace = true

[dev-dependencies]
gungraun = "=0.20.0"
quint-connect = "0.1.2"
rubato = "5.0.1"
strsim = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util", "io-util"] }
wiremock = "0.6.5"

[[bench]]
name = "domain"
harness = false

[workspace.lints.rust]
warnings = "deny"
dead_code = "deny"
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)"] }

[workspace.lints.clippy]
pedantic = "deny"
unwrap_used = "deny"
string_add = "deny"
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
