[workspace]
members = ["xtask"]

[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[workspace.lints.rust]
warnings = "deny"
dead_code = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "deny"
unwrap_used = "deny"
string_add = "deny"
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
