[workspace]
members = ["xtask"]

[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3.34"
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
toml = "1.1.8"
vstd = "=0.0.0-2026-10-25-0158"

[package.metadata.verus]
verify = true

[lints]
workspace = true

[dev-dependencies]
gungraun = "=0.20.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util", "io-util"] }

[[bench]]
name = "domain"
harness = false

[workspace.lints.rust]
warnings = "deny"
dead_code = "deny"
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)"] }

[workspace.lints.clippy]
pedantic = "deny"
unwrap_used = "deny"
string_add = "deny"
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
