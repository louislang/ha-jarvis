[workspace]
members = ["xtask"]

[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
vstd = "=0.0.0-2026-10-25-0158"

[package.metadata.verus]
verify = true

[lints]
workspace = true

[workspace.lints.rust]
warnings = "deny"
dead_code = "deny"
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)"] }

[workspace.lints.clippy]
pedantic = "deny"
unwrap_used = "deny"
string_add = "deny"
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"
