events {
}

http {
    include mime.types;

    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;

        location / {
            proxy_pass @URL@;
            proxy_set_header Authorization "Bearer @TOKEN@";
            proxy_connect_timeout 5s;
        }

        # The status code stays 502, 503 or 504, so the review page sees the failure.
        error_page 502 503 504 /down.html;

        location = /down.html {
            root /www;
            internal;
        }
    }
}
