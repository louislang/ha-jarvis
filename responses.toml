[pools.lights_on]
responses = ["I am turning the lights on.", "I will turn on the lights.", "Powering up the {{ area }} lights."]

[pools.fan_on]
responses = ["I am turning the fan on.", "Starting the {{ area }} fan."]

[pools.climate_down]
responses = ["I am turning the air down.", "Making it cooler."]

[pools.tv_show]
responses = ["Putting {{ show }} on the TV.", "Playing {{ show }}."]

[pools.temperature_query]
responses = ["It is {{ entity.state }} degrees in the {{ area }}."]

[pools.weather]
responses = ["Today will be {{ response.condition }}, with a high of {{ response.high }} degrees."]

[pools.lights_query]
responses = ['{% if entities %}{{ entities | map(attribute="name") | join(", ") }} {{ "is" if entities | length == 1 else "are" }} on.{% else %}No lights are on in the {{ area }}.{% endif %}']

[pools.brightness_query]
responses = ['{% for light in entities %}{{ light.name }} {% if light.attributes.brightness is defined and light.attributes.brightness is number %}is at {{ (light.attributes.brightness / 2.55) | round | int }} percent{% else %}has no brightness value{% endif %}.{{ " " if not loop.last else "" }}{% else %}No lights are on in the {{ area }}.{% endfor %}']

[pools.filler]
responses = ["I will check on that for you.", "Let me look into that.", "One moment."]

[pools.failure]
responses = ["Sorry, I could not do that."]

[pools.fallback]
responses = ["Sorry, I could not find that."]
