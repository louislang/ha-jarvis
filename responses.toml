[pools.lights_on]
responses = ["I am turning the lights on.", "I will turn on the lights.", "Powering up the {{ area }} lights."]

[pools.fan_on]
responses = ["I am turning the fan on.", "Starting the {{ area }} fan."]

[pools.climate_down]
responses = ["I am turning the air down.", "Making it cooler."]

[pools.tv_show]
responses = ["Putting {{ show }} on the TV.", "Playing {{ show }}."]

[pools.temperature_query]
responses = ["It is {{ entity.state }} degrees in the {{ area }}."]

[pools.weather]
responses = ["Today will be {{ response.condition }}, with a high of {{ response.high }} degrees."]

[pools.lights_query]
responses = ['{% if entities %}{{ entities | map(attribute="name") | join(", ") }} {{ "is" if entities | length == 1 else "are" }} on.{% else %}No lights are on in the {{ area }}.{% endif %}']

[pools.brightness_query]
responses = ['{% for light in entities %}{{ light.name }} {% if light.attributes.brightness is defined and light.attributes.brightness is number %}is at {{ (light.attributes.brightness / 2.55) | round | int }} percent{% else %}has no brightness value{% endif %}.{{ " " if not loop.last else "" }}{% else %}No lights are on in the {{ area }}.{% endfor %}']

[pools.lock_query]
responses = ['{% for lock in entities %}The {{ lock.name }} is {{ lock.state }}.{{ " " if not loop.last else "" }}{% endfor %}']

[pools.garage_door_query]
responses = ['{% for door in entities %}The {{ door.name }} is {{ door.state }}.{{ " " if not loop.last else "" }}{% endfor %}']

[pools.windows_query]
responses = ['{% set others = entities | rejectattr("state", "eq", "off") | list %}{% for window in others %}{{ window.name }} is {{ "open" if window.state == "on" else window.state }}.{{ " " if not loop.last else "" }}{% else %}All windows are closed.{% endfor %}']

[pools.climate_query]
responses = ['{% if entity.state == "off" %}The thermostat is off.{% else %}The thermostat is set to {{ entity.attributes.temperature | int }} degrees in {{ entity.state | replace("_", " ") }} mode.{% endif %}']

[pools.fan_query]
responses = ["The {{ entity.name }} is {{ entity.state }}."]

[pools.who_is_home]
responses = ['{% if entities %}{{ entities | map(attribute="name") | join(" and ") }} {{ "is" if entities | length == 1 else "are" }} home.{% else %}Nobody is home.{% endif %}']

[pools.alarm_query]
responses = ['{% if entity.state == "disarmed" %}The alarm is off.{% else %}The alarm is {{ entity.state | replace("_", " ") }}.{% endif %}']

[pools.now_playing]
responses = ['{% for player in entities %}{% if player.attributes.media_title is defined and player.attributes.media_title is string %}{{ player.attributes.media_title }}{% if player.attributes.media_artist is defined and player.attributes.media_artist is string %} by {{ player.attributes.media_artist }}{% endif %}{% else %}Something with no title{% endif %} is playing on the {{ player.name }}.{{ " " if not loop.last else "" }}{% else %}Nothing is playing in the {{ area }}.{% endfor %}']

[pools.play_music]
responses = ["Playing {{ media }}."]

[pools.play_radio]
responses = ["Playing music like {{ media }}."]

[pools.queue_music]
responses = ["Adding {{ media }} to the queue."]

[pools.music_next]
responses = ["Next song."]

[pools.music_pause]
responses = ["Pausing the music."]

[pools.volume_up]
responses = ["Turning it up."]

[pools.volume_down]
responses = ["Turning it down."]

[pools.volume_set]
responses = ["Setting the volume to {{ volume }} percent."]

[pools.play_movie]
responses = ["Putting on {{ movie }}."]

[pools.continue_show]
responses = ["Continuing {{ show }}."]

[pools.play_episode]
responses = ["Playing {{ show }}, season {{ season }}, episode {{ episode }}."]

[pools.tv_pause]
responses = ["Pausing the TV."]

[pools.tv_skip]
responses = ["Skipping ahead."]

[pools.tv_stop]
responses = ["Stopping the TV."]

[pools.filler]
responses = ["I will check on that for you.", "Let me look into that.", "One moment."]

[pools.failure]
responses = ["Sorry, I could not do that."]
