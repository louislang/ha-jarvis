[pools.lights_on]
responses = ["I am turning the lights on.", "I will turn on the lights.", "Powering up the {{ area }} lights."]

[pools.fan_on]
responses = ["I am turning the fan on.", "Starting the {{ area }} fan."]

[pools.climate_down]
responses = ["I am turning the air down.", "Making it cooler."]

[pools.tv_show]
responses = ["Putting {{ show }} on the TV.", "Playing {{ show }}."]

[pools.temperature_query]
responses = ["It is {{ entity.state }} degrees in the {{ area }}."]

[pools.weather]
# HA gives a condition value such as `partlycloudy`, which TTS cannot say.
responses = ["{% set words = {'clear-night': 'clear', 'fog': 'foggy', 'hail': 'stormy with hail', 'lightning': 'stormy', 'lightning-rainy': 'stormy with rain', 'partlycloudy': 'partly cloudy', 'pouring': 'very rainy', 'snowy-rainy': 'snowy with rain', 'windy-variant': 'windy and cloudy'} %}{% set condition = response['weather.forecast_home'].forecast[0].condition %}Today will be {{ words[condition] if condition in words else condition }}."]

[pools.filler]
responses = ["I will check on that for you.", "Let me look into that.", "One moment."]

[pools.failure]
responses = ["Sorry, I could not do that."]

[pools.fallback]
responses = ["Sorry, I could not find that."]
