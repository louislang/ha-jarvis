min_examples = 3
unknown_examples = ["what is the meaning of life", "tell me about rome", "how far away is the moon", "write a poem about cats", "who won the game last night"]

[[intent]]
name = "lights_on"
kind = "command"
examples = ["turn on the lights", "turn on the [kitchen](area) lights", "lights on", "switch the lights on in the [living room](area)", "can you turn the [office](area) lights on"]
service = "homeassistant.turn_on"
target = "entities"
select = [{ domain = "light" }, { domain = "switch", name = "light" }]

[[intent]]
name = "fan_on"
kind = "command"
examples = ["turn on the fan", "turn on the [office](area) fan", "fan on please", "start the fan"]
service = "homeassistant.turn_on"
target = "entity"
select = [{ domain = "fan" }, { domain = "switch", name = "fan" }]

[[intent]]
name = "climate_down"
kind = "command"
examples = ["turn the air down", "turn the ac down", "make it cooler", "lower the temperature"]
service = "climate.set_temperature"
target = "entity"
select = [{ domain = "climate" }]
data = { temperature = "{{ entity.attributes.temperature - 2 }}" }

[[intent]]
name = "tv_show"
kind = "command"
examples = ["put the tv on [the office](show)", "play [bluey](show) on the tv", "turn the tv to [jeopardy](show)"]
service = "media_player.play_media"
target = "entity"
select = [{ domain = "media_player", name = "tv" }]
data = { media_content_type = "episode", media_content_id = 'plex://{"library_name": "TV Shows", "show_name": "{{ show }}", "shuffle": 1}' }

[[intent]]
name = "temperature_query"
kind = "query"
examples = ["what is the temperature", "what is the temperature in the [bedroom](area)", "how warm is it in here"]
select = [{ domain = "sensor", device_class = "temperature" }]

[[intent]]
name = "weather"
kind = "fetch"
examples = ["what is the weather like", "will it rain today", "what is the forecast"]
plugin = "get_weather"
data = { when = "today" }

[[intent]]
name = "windows_query"
kind = "query"
examples = ["are any windows open", "is a window open", "are the windows closed"]
target = "house"
select = [{ domain = "binary_sensor", device_class = "window" }]

[[intent]]
name = "lock_query"
kind = "query"
examples = ["is the front door locked", "are the doors locked", "is the door locked", "did i lock the door"]
target = "house"
select = [{ domain = "lock" }]

[[intent]]
name = "garage_door_query"
kind = "query"
examples = ["is the garage door open", "is the garage door closed", "did i close the garage door"]
target = "house"
select = [{ domain = "cover", device_class = "garage" }]

[[intent]]
name = "brightness_query"
kind = "query"
examples = ["how bright is the [office](area) light", "how bright are the lights", "what is the brightness of the [bedroom](area) lights"]
target = "entities"
select = [{ domain = "light" }]
state = "on"

[[intent]]
name = "lights_query"
kind = "query"
examples = ["is the [garage](area) light on", "which lights are on", "are the lights on in the [kitchen](area)", "are any lights on"]
target = "entities"
select = [{ domain = "light" }, { domain = "switch", name = "light" }]
state = "on"

[[intent]]
name = "climate_query"
kind = "query"
examples = ["what is the thermostat set to", "is the ac on", "is the heat on", "what temperature is the thermostat set to"]
target = "entity"
select = [{ domain = "climate" }]

[[intent]]
name = "fan_query"
kind = "query"
examples = ["is the fan on", "is the [office](area) fan on", "is the fan running"]
target = "entity"
select = [{ domain = "fan" }, { domain = "switch", name = "fan" }]

[[intent]]
name = "who_is_home"
kind = "query"
examples = ["who is home", "is anyone home", "who is in the house", "is anybody home"]
target = "house"
select = [{ domain = "person" }]
state = "home"

[[intent]]
name = "alarm_query"
kind = "query"
examples = ["is the alarm set", "is the alarm on", "is the house armed", "did i set the alarm"]
target = "entity"
select = [{ domain = "alarm_control_panel" }]

[[intent]]
name = "now_playing"
kind = "query"
examples = ["what is playing in the [living room](area)", "what is playing on the [living room](area) tv", "what song is this", "what is playing", "what is this song"]
target = "entities"
select = [{ domain = "media_player" }]
state = "playing"

[[intent]]
name = "play_music"
kind = "command"
examples = ["play [radiohead](media)", "play [jazz](media) in the [kitchen](area)", "play the album [abbey road](media)", "play my [workout](media) playlist", "play the song [yesterday](media)", "play [hip hop](media)", "play [red hot chili peppers](media)", "play some [lo fi beats](media)"]
service = "music_assistant.play_media"
target = "entity"
select = [{ domain = "media_player", device_class = "speaker" }]
data = { media_id = "{{ media }}" }
search = true

[[intent]]
name = "play_radio"
kind = "command"
examples = ["play music like [radiohead](media)", "play something like [miles davis](media)", "start a radio station for [taylor swift](media)"]
service = "music_assistant.play_media"
target = "entity"
select = [{ domain = "media_player", device_class = "speaker" }]
data = { media_id = "{{ media }}", radio_mode = "{{ true }}" }

[[intent]]
name = "queue_music"
kind = "command"
examples = ["add [yesterday](media) to the queue", "queue [abbey road](media)", "put [hey jude](media) in the queue"]
service = "music_assistant.play_media"
target = "entity"
select = [{ domain = "media_player", device_class = "speaker" }]
data = { media_id = "{{ media }}", enqueue = "add" }

[[intent]]
name = "music_next"
kind = "command"
examples = ["next song", "skip this song", "play the next track", "skip to the next song in the [kitchen](area)"]
service = "media_player.media_next_track"
target = "entity"
select = [{ domain = "media_player", device_class = "speaker" }]

[[intent]]
name = "music_pause"
kind = "command"
examples = ["pause the music", "stop the music", "pause the music in the [kitchen](area)"]
service = "media_player.media_pause"
target = "entity"
select = [{ domain = "media_player", device_class = "speaker" }]

[[intent]]
name = "volume_up"
kind = "command"
examples = ["turn it up", "volume up", "turn up the music", "make the music louder"]
service = "media_player.volume_up"
target = "entity"
select = [{ domain = "media_player", device_class = "speaker" }]

[[intent]]
name = "volume_down"
kind = "command"
examples = ["turn it down", "volume down", "turn down the music", "make the music quieter"]
service = "media_player.volume_down"
target = "entity"
select = [{ domain = "media_player", device_class = "speaker" }]

[[intent]]
name = "volume_set"
kind = "command"
examples = ["set the volume to [50](volume)", "volume [30](volume)", "set the music volume to [20](volume) percent"]
service = "media_player.volume_set"
target = "entity"
select = [{ domain = "media_player", device_class = "speaker" }]
data = { volume_level = "{{ volume | number | int / 100 }}" }

[[intent]]
name = "play_movie"
kind = "command"
examples = ["put on [the matrix](movie)", "play the movie [inception](movie)", "watch [toy story](movie)", "put on the movie [up](movie)"]
service = "media_player.play_media"
target = "entity"
select = [{ domain = "media_player", name = "tv" }]
data = { media_content_type = "movie", media_content_id = 'plex://{"library_name": "Movies", "title": "{{ movie }}"}' }

[[intent]]
name = "continue_show"
kind = "command"
examples = ["continue [the office](show)", "play the next episode of [bluey](show)", "keep watching [severance](show)", "next episode of [the office](show)"]
service = "media_player.play_media"
target = "entity"
select = [{ domain = "media_player", name = "tv" }]
data = { media_content_type = "episode", media_content_id = 'plex://{"library_name": "TV Shows", "show_name": "{{ show }}", "resume": 1}' }

[[intent]]
name = "play_episode"
kind = "command"
examples = ["play season [two](season) episode [five](episode) of [the office](show)", "put on [bluey](show) season [one](season) episode [three](episode)", "watch [severance](show) season [1](season) episode [1](episode)"]
service = "media_player.play_media"
target = "entity"
select = [{ domain = "media_player", name = "tv" }]
data = { media_content_type = "episode", media_content_id = 'plex://{"library_name": "TV Shows", "show_name": "{{ show }}", "season_number": {{ season | number }}, "episode_number": {{ episode | number }}}' }

[[intent]]
name = "tv_pause"
kind = "command"
examples = ["pause the tv", "pause the show", "pause the movie"]
service = "media_player.media_pause"
target = "entity"
select = [{ domain = "media_player", name = "tv" }]

[[intent]]
name = "tv_skip"
kind = "command"
examples = ["skip ahead", "skip ahead on the tv", "fast forward the movie"]
service = "media_player.media_seek"
target = "entity"
select = [{ domain = "media_player", name = "tv" }]
data = { seek_position = "{{ entity.position + 30 }}" }

[[intent]]
name = "tv_stop"
kind = "command"
examples = ["stop the tv", "stop the movie", "stop the show"]
service = "media_player.media_stop"
target = "entity"
select = [{ domain = "media_player", name = "tv" }]

[[intent]]
name = "new_shows"
kind = "fetch"
examples = ["are there any new shows", "what is new on plex", "is there anything new to watch", "what shows can i continue"]
plugin = "get_new_shows"
