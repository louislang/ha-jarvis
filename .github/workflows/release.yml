name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # The called `diagram` job asks for `pull-requests: write`. A called job cannot get more than the caller.
    permissions:
      contents: read
      pull-requests: write

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      ARCHIVE: jarvis-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      # The Linux archive has the CUDA libraries, the macOS archive the CPU libraries.
      - run: just ${{ runner.os == 'Linux' && 'cuda-libraries' || 'models' }}
      - run: echo "SHERPA_ONNX_LIB_DIR=$(just --evaluate ${{ runner.os == 'Linux' && 'cuda_libraries' || 'cpu_libraries' }})" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}
      - run: tar -czhf "$ARCHIVE" -C "target/${{ matrix.target }}/release" jarvis -C "$GITHUB_WORKSPACE"/models/sherpa-onnx-v2.0.1-*/lib .
      - run: |
          mkdir verify
          tar -xzf "$ARCHIVE" -C verify
          cd verify
          file jarvis | grep -E 'ELF 64-bit LSB .*executable, x86-64|Mach-O 64-bit executable x86_64'
          if [ "$RUNNER_OS" = Linux ]; then
            export ORT_DYLIB_PATH="$PWD/libonnxruntime.so" LD_LIBRARY_PATH="$PWD"
            test -f libonnxruntime.so
            test -f libonnxruntime_providers_cuda.so
            libraries=$(ldd ./jarvis)
            if grep 'not found' <<< "$libraries"; then exit 1; fi
          else
            export ORT_DYLIB_PATH="$PWD/libonnxruntime.dylib" DYLD_LIBRARY_PATH="$PWD"
          fi
          ./jarvis
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jarvis-*.tar.gz --repo "$GITHUB_REPOSITORY"

  train-image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jarvis-train:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t "$IMAGE" train
      - run: |
          installed=$(docker run --rm "$IMAGE" pip list --format=freeze)
          dev=$(sed -n '/^dev = \[/,/^\]/s/^ *"\(.*\)==.*/\1/p' train/pyproject.toml)
          test -n "$dev"
          if cut -d= -f1 <<< "$installed" | grep -ixF "$dev"; then exit 1; fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: docker push "$IMAGE"
      - run: docker manifest inspect "$IMAGE"
