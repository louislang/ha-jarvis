name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just format

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: |
            models
            !models/system-one
          key: models-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: models-${{ runner.os }}-
      - run: just models
      - run: just lint

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-rust-code-analysis-cli
      - run: just complexity

  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just install-jscpd
      - run: just duplication

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just architecture

  fixture-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: just install-python
      # The fixture model has its own cache.
      - uses: actions/cache@v6
        with:
          path: |
            models
            !models/system-one
          key: models-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: models-${{ runner.os }}-
      - run: just models
      # `jarvis` links the sherpa-onnx libraries, so `jarvis dataset` needs them at run time.
      - run: |
          echo "SHERPA_ONNX_LIB_DIR=$(just --evaluate cpu_libraries)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(just --evaluate cpu_libraries)" >> "$GITHUB_ENV"
      - run: mkdir -p target/fixture && cargo run --release -- dataset jarvis.toml target/fixture/train.json --house src/testing/house.json
      - uses: actions/cache@v6
        with:
          path: models/system-one/fixture
          key: fixture-model-${{ hashFiles('target/fixture/train.json', 'justfile', 'train/**') }}
      - run: just fixture-model

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-cargo-llvm-cov
      - run: just install-rust-code-analysis-cli
      - run: just install-jscpd
      - run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: just install-quint
      - run: just install-quint-evaluator
      - run: just install-verus
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: just install-python
      # The fixture model has its own cache.
      - uses: actions/cache@v6
        with:
          path: |
            models
            !models/system-one
          key: models-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: models-${{ runner.os }}-
      - run: just models
      # `jarvis` links the sherpa-onnx libraries, so `jarvis dataset` needs them at run time.
      - run: |
          echo "SHERPA_ONNX_LIB_DIR=$(just --evaluate cpu_libraries)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(just --evaluate cpu_libraries)" >> "$GITHUB_ENV"
      - run: mkdir -p target/fixture && cargo run --release -- dataset jarvis.toml target/fixture/train.json --house src/testing/house.json
      - uses: actions/cache@v6
        with:
          path: models/system-one/fixture
          key: fixture-model-${{ hashFiles('target/fixture/train.json', 'justfile', 'train/**') }}
      - run: just fixture-model
      - run: just cov

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-valgrind
      - run: just install-gungraun-runner
      - uses: actions/cache@v6
        with:
          path: |
            models
            !models/system-one
          key: models-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: models-${{ runner.os }}-
      - run: just models
      - run: just bench

  quint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: just install-quint
      - run: just install-quint-evaluator
      - run: just quint

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: just install-python
      - run: just python

  verus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-verus
      - uses: actions/cache@v6
        with:
          path: |
            models
            !models/system-one
          key: models-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: models-${{ runner.os }}-
      - run: just models
      - run: just verus

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just install-actionlint
      - run: just workflow-lint

  gpu-test:
    # The repository is public: a fork pull request must not run code on the GPU host.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The fixture model comes from the cache that `fixture-model` writes.
    needs: fixture-model
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v7
        # Keeps the files of `just gpu-models` between runs.
        with:
          clean: false
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - run: just gpu-models
      # `jarvis` links the sherpa-onnx libraries, so `jarvis dataset` needs them at run time.
      - run: |
          echo "SHERPA_ONNX_LIB_DIR=$(just --evaluate cuda_libraries)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(just --evaluate cuda_libraries)" >> "$GITHUB_ENV"
      - run: mkdir -p target/fixture && cargo run --release -- dataset jarvis.toml target/fixture/train.json --house src/testing/house.json
      - uses: actions/cache/restore@v6
        with:
          path: models/system-one/fixture
          key: fixture-model-${{ hashFiles('target/fixture/train.json', 'justfile', 'train/**') }}
          fail-on-cache-miss: true
      - run: sudo systemctl stop jarvis
      - run: just gpu-test
      - if: always()
        run: sudo systemctl start jarvis

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          cargo run -p xtask -- pr-size --base "origin/$base" --limit 400

  diagram:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- jarvis-architecture -->"
          PR: ${{ github.event.pull_request.number }}
        run: |
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          {
            echo "$MARKER"
            cargo run -p xtask -- diagram --base "origin/$base"
          } > diagram.md
          cat diagram.md >> "$GITHUB_STEP_SUMMARY"
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@diagram.md
          else
            gh pr comment "$PR" --body-file diagram.md
          fi
