name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just format

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just lint

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-rust-code-analysis-cli
      - run: just complexity

  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just install-jscpd
      - run: just duplication

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just architecture

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-cargo-llvm-cov
      - run: just install-rust-code-analysis-cli
      - run: just install-jscpd
      - run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: just install-quint
      - run: just install-quint-evaluator
      - run: just cov

  quint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: just install-quint
      - run: just install-quint-evaluator
      - run: just quint

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just install-actionlint
      - run: just workflow-lint

  gpu-test:
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - run: sudo systemctl stop jarvis
      - run: just gpu-test
      - if: always()
        run: sudo systemctl start jarvis

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          cargo run -p xtask -- pr-size --base "origin/$base" --limit 400

  diagram:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- jarvis-architecture -->"
          PR: ${{ github.event.pull_request.number }}
        run: |
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          {
            echo "$MARKER"
            cargo run -p xtask -- diagram --base "origin/$base"
          } > diagram.md
          cat diagram.md >> "$GITHUB_STEP_SUMMARY"
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@diagram.md
          else
            gh pr comment "$PR" --body-file diagram.md
          fi
