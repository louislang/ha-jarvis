name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just format

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: |
            models
            !models/system-one
          key: models-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: models-${{ runner.os }}-
      - run: just models
      - run: just lint

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-rust-code-analysis-cli
      - run: just complexity

  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just install-jscpd
      - run: just duplication

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just architecture

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-cargo-llvm-cov
      - run: just install-rust-code-analysis-cli
      - run: just install-jscpd
      - run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: just install-quint
      - run: just install-quint-evaluator
      - run: just install-verus
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: just install-python
      # The fixture model has its own cache.
      - uses: actions/cache@v6
        with:
          path: |
            models
            !models/system-one
          key: models-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: models-${{ runner.os }}-
      - run: just models
      - run: echo "SHERPA_ONNX_LIB_DIR=$(just --evaluate cpu_libraries)" >> "$GITHUB_ENV"
      - run: mkdir -p target/fixture && cargo run --release -- dataset jarvis.toml target/fixture/train.json --house src/testing/house.json
      - uses: actions/cache@v6
        with:
          path: models/system-one/fixture
          key: fixture-model-${{ hashFiles('target/fixture/train.json', 'train/**') }}
      - run: just fixture-model
      - run: just cov

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-valgrind
      - run: just install-gungraun-runner
      - uses: actions/cache@v6
        with:
          path: |
            models
            !models/system-one
          key: models-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: models-${{ runner.os }}-
      - run: just models
      - run: just bench

  quint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: just install-quint
      - run: just install-quint-evaluator
      - run: just quint

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: just install-python
      - run: just python

  verus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-verus
      - uses: actions/cache@v6
        with:
          path: |
            models
            !models/system-one
          key: models-${{ runner.os }}-${{ hashFiles('justfile') }}
          restore-keys: models-${{ runner.os }}-
      - run: just models
      - run: just verus

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just install-actionlint
      - run: just workflow-lint

  gpu-test:
    # The repository is public: a fork pull request must not run code on the GPU host.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The fixture model comes from the cache that `rust-test` writes.
    needs: rust-test
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v7
        # Keeps the files of `just gpu-models` between runs.
        with:
          clean: false
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - name: Host and measured models
        run: |
          lscpu
          nproc
          free -h
          df -h .
          nvidia-smi
          just models
          hf=https://huggingface.co/csukuangfj2
          prefix=sherpa-onnx-nemotron-speech-streaming-en-0.6b
          int8_160=models/$prefix-160ms-int8-2026-04-25
          fetch() {
            mkdir -p "models/$1"
            if ! echo "$3  models/$1/$2" | sha256sum --check --status; then
              curl -sSfL -o "models/$1/$2" "$hf/$1/resolve/main/$2"
              echo "$3  models/$1/$2" | sha256sum --check
            fi
          }
          fetch "$prefix-80ms-int8-2026-04-25" encoder.int8.onnx 29a6aaf9155f25562a08a1aeea1f1a1a5d24b2f44a1d68211faf8a92073d1df6
          for file in decoder.int8.onnx joiner.int8.onnx tokens.txt; do
            ln -f "$int8_160/$file" "models/$prefix-80ms-int8-2026-04-25/$file"
          done
          fetch "$prefix-160ms-2026-04-25" encoder.onnx b46566b6deb00ad97da0c12bd119ee86e2bc89055c60bf8eba1f2dba205a50ef
          fetch "$prefix-160ms-2026-04-25" encoder.data 44f65771e1570546f61106b3d0c604a60b398d061476fda8042bb05432601bd4
          fetch "$prefix-160ms-2026-04-25" decoder.onnx 17614cc0415d49daefd63cd91cb3415af046fa5a487c2049def68f51a667d6fe
          fetch "$prefix-160ms-2026-04-25" joiner.onnx d4ef2398e4b19cb166c0c12f03cb20333e4d359d63c5fd8cf965c0649c1d0d03
          ln -f "$int8_160/tokens.txt" "models/$prefix-160ms-2026-04-25/tokens.txt"
          fetch "$prefix-80ms-2026-04-25" encoder.onnx bc97f0671b127b56878ab9fd1b617734912fe51663e3c70c8a9923e3d3cb9136
          for file in encoder.data decoder.onnx joiner.onnx tokens.txt; do
            ln -f "models/$prefix-160ms-2026-04-25/$file" "models/$prefix-80ms-2026-04-25/$file"
          done
          printf 'cudnn_conv_algo_search=EXHAUSTIVE\ncudnn_conv_use_max_workspace=1\n' > models/exhaustive.config
          du -sh models/*
          df -h .
      - run: just gpu-models
      - run: echo "SHERPA_ONNX_LIB_DIR=$(just --evaluate cuda_libraries)" >> "$GITHUB_ENV"
      - run: mkdir -p target/fixture && cargo run --release -- dataset jarvis.toml target/fixture/train.json --house src/testing/house.json
      - uses: actions/cache/restore@v6
        with:
          path: models/system-one/fixture
          key: fixture-model-${{ hashFiles('target/fixture/train.json', 'train/**') }}
          fail-on-cache-miss: true
      - run: sudo systemctl stop jarvis
      - name: Start the GPU memory log
        run: |
          nvidia-smi --query-gpu=timestamp,memory.used,memory.total,utilization.gpu --format=csv -l 1 > gpu-memory.csv &
      - run: just gpu-test
      - name: Print the GPU memory log
        if: always()
        run: |
          pkill -f "nvidia-smi --query-gpu" || true
          cat gpu-memory.csv
      - if: always()
        run: sudo systemctl start jarvis

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          cargo run -p xtask -- pr-size --base "origin/$base" --limit 400

  diagram:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- jarvis-architecture -->"
          PR: ${{ github.event.pull_request.number }}
        run: |
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          {
            echo "$MARKER"
            cargo run -p xtask -- diagram --base "origin/$base"
          } > diagram.md
          cat diagram.md >> "$GITHUB_STEP_SUMMARY"
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@diagram.md
          else
            gh pr comment "$PR" --body-file diagram.md
          fi
