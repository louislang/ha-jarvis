name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just format

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just lint

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-rust-code-analysis-cli
      - run: just complexity

  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just install-jscpd
      - run: just duplication

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just architecture

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - uses: Swatinem/rust-cache@v2
      - run: just install-cargo-llvm-cov
      - run: just install-rust-code-analysis-cli
      - run: just install-jscpd
      - run: just cov

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.59.0"
      - run: just install-actionlint
      - run: just workflow-lint

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- pr-size --base origin/${{ github.base_ref }} --limit 400

  diagram:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- jarvis-architecture -->"
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "$MARKER"
            cargo run -p xtask -- diagram --base origin/${{ github.base_ref }}
          } > diagram.md
          cat diagram.md >> "$GITHUB_STEP_SUMMARY"
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@diagram.md
          else
            gh pr comment "$PR" --body-file diagram.md
          fi
