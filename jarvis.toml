listen = "0.0.0.0:10700"
device = "cuda"
intents = "intents.toml"

[ha]
url = "ws://homeassistant.local:8123/api/websocket"
token_env = "HA_TOKEN"
request_timeout_ms = 5000
ping_interval_s = 30

[model]
threshold = 0.6

[train]
base_model = "sentence-transformers/all-MiniLM-L12-v2"
epochs = 8
batch_size = 8
holdout = 0.1
