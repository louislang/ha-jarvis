<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  /* The names and the defaults are those of the Home Assistant theme. Inside HA, `followTheme`
     copies the values of the HA page. */
  :root {
    color-scheme: light dark;
    --primary-color: #009ac7;
    --text-primary-color: #fff;
    --primary-text-color: #141414;
    --secondary-text-color: #5e5e5e;
    --primary-background-color: #fafafa;
    --card-background-color: #fff;
    --divider-color: #0000001f;
    --input-fill-color: #f5f5f5;
    --success-color: #43a047;
    --warning-color: #ffa600;
    --error-color: #db4437;
    --ha-card-border-radius: 12px;
    --ha-font-family-body: Roboto, Noto, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #9b9b9b;
      --primary-background-color: #111;
      --card-background-color: #1c1c1c;
      --divider-color: #e1e1e11f;
      --input-fill-color: #ffffff0d;
    }
  }
  body {
    margin: 0;
    background: var(--primary-background-color);
    color: var(--primary-text-color);
    font: 14px/1.43 var(--ha-font-family-body);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0 16px;
    min-height: 56px;
    padding: 0 16px;
    background: var(--app-header-background-color, var(--card-background-color));
    color: var(--app-header-text-color, var(--primary-text-color));
    border-bottom: 1px solid var(--divider-color);
  }
  h1 { margin: 0; font-size: 20px; font-weight: 400; }
  nav { display: flex; align-self: stretch; flex: 1; }
  [role="tab"] {
    height: auto;
    padding: 0 16px;
    border: 0;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    background: none;
    color: var(--secondary-text-color);
    font: 500 14px var(--ha-font-family-body);
    cursor: pointer;
  }
  [role="tab"][aria-selected="true"] { color: var(--primary-color); border-bottom-color: var(--primary-color); }
  #status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border: 1px solid var(--divider-color);
    border-radius: 9999px;
    font-weight: 500;
  }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--error-color); }
  #status[data-state="online"]::before { background: var(--success-color); }
  #status[data-state="training"]::before, #status[data-state="restarting"]::before { background: var(--warning-color); }
  #status .message { color: var(--secondary-text-color); font-weight: 400; }
  main { max-width: 840px; margin: 0 auto; padding: 16px; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: var(--secondary-text-color); }
  article, fieldset {
    margin: 0 0 16px;
    padding: 16px;
    background: var(--ha-card-background, var(--card-background-color));
    border: 1px solid var(--divider-color);
    border-radius: var(--ha-card-border-radius);
  }
  #interactions:empty::after { content: "No interactions."; color: var(--secondary-text-color); }
  .transcript, .name { margin: 0; font-size: 16px; font-weight: 500; }
  .meta { margin: 0 0 12px; color: var(--secondary-text-color); font-size: 12px; }
  audio { display: block; width: 100%; height: 40px; }
  .responses, .examples { margin: 12px 0 0; padding: 0 0 0 12px; list-style: none; border-left: 2px solid var(--primary-color); }
  .responses:empty { display: none; }
  .action {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 12px -16px -16px;
    padding: 8px 16px;
    border-top: 1px solid var(--divider-color);
  }
  .intent, .service { flex: 1; font-family: ui-monospace, monospace; font-size: 13px; color: var(--secondary-text-color); }
  button {
    height: 40px;
    padding: 0 16px;
    border: 1px solid var(--divider-color);
    border-radius: 9999px;
    background: none;
    color: var(--primary-color);
    font: 500 14px var(--ha-font-family-body);
    cursor: pointer;
  }
  .mark-good[aria-pressed="true"] { color: var(--success-color); background: color-mix(in srgb, var(--success-color) 15%, transparent); border-color: transparent; }
  .mark-bad[aria-pressed="true"] { color: var(--error-color); background: color-mix(in srgb, var(--error-color) 15%, transparent); border-color: transparent; }
  #more { display: block; margin: 0 auto; }
  #more[hidden] { display: none; }
  #save { border: 0; background: var(--primary-color); color: var(--text-primary-color); }
  input, select, textarea {
    box-sizing: border-box;
    padding: 8px 12px;
    border: 0;
    border-bottom: 1px solid var(--secondary-text-color);
    border-radius: 4px 4px 0 0;
    background: var(--input-fill-color);
    color: var(--primary-text-color);
    font: 14px var(--ha-font-family-body);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-bottom: 2px solid var(--primary-color); }
  legend { float: left; width: 100%; padding: 0 0 8px; font-size: 20px; }
  fieldset label {
    clear: both;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
    align-items: center;
    gap: 16px;
    padding: 8px 0;
    border-top: 1px solid var(--divider-color);
    font-family: ui-monospace, monospace;
    font-size: 13px;
  }
  /* A phone: one column, and 16px text in fields so that iOS does not zoom in on focus. */
  @media (max-width: 600px) {
    fieldset label { grid-template-columns: 1fr; gap: 4px; }
    .intent { flex-basis: 100%; }
    .correction { flex: 1; }
    input, select, textarea { font-size: 16px; }
  }
  .actions {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
    padding: 12px 0;
    background: var(--primary-background-color);
  }
  #settings-error { margin: 0; color: var(--error-color); }
</style>
</head>
<body>
<header>
  <h1>Jarvis</h1>
  <nav role="tablist">
    <button role="tab" type="button" aria-selected="true" data-panel="review">Review</button>
    <button role="tab" type="button" aria-selected="false" data-panel="configuration">Settings</button>
  </nav>
  <section id="status"><span class="state"></span><span class="message"></span></section>
</header>
<main>
<section id="review" role="tabpanel">
  <div id="proposals"></div>
  <div class="toolbar">
    Show
    <select id="filter">
      <option value="all">All</option>
      <option value="bad">Bad</option>
      <option value="unmarked">Unmarked</option>
    </select>
  </div>
  <div id="interactions"></div>
  <button id="more" type="button" hidden>More</button>
</section>
<template id="interaction">
  <article>
    <p class="transcript"></p>
    <p class="meta"><time class="time"></time> · <span class="satellite"></span>
      <select class="speaker" aria-label="Speaker"><option value="">Unknown speaker</option></select></p>
    <audio controls preload="none"></audio>
    <ul class="responses"></ul>
    <div class="action">
      <span class="intent"></span>
      <button class="mark-good" type="button">Good</button>
      <button class="mark-bad" type="button">Bad</button>
      <select class="correction"><option value="">Correct intent</option></select>
    </div>
  </article>
</template>
<template id="proposal">
  <article>
    <p class="name"></p>
    <ul class="examples"></ul>
    <div class="action">
      <span class="service"></span>
      <button class="approve" type="button">Approve</button>
      <button class="reject" type="button">Reject</button>
    </div>
  </article>
</template>
<section id="configuration" role="tabpanel" hidden>
  <form id="settings">
    <div id="fields"></div>
    <div class="actions">
      <p id="settings-error" role="alert"></p>
      <button id="save" type="submit">Save</button>
    </div>
  </form>
  <template id="person">
    <label><span>Address <span class="name"></span> as</span><input class="address" type="text"></label>
  </template>
</section>
</main>
<template id="response">
  <li>
    <span class="text"></span>
  </li>
</template>
<script>
  // Every URL is relative: HA ingress serves the page under a path prefix, and the add-on adds
  // the token.
  const list = document.getElementById('interactions');
  const filter = document.getElementById('filter');
  const more = document.getElementById('more');
  const statusSection = document.getElementById('status');
  let intents = [];
  let people = [];
  const listedPeople = fetch('api/people')
    .then((response) => (response.ok ? response.json() : []))
    .catch(() => []);
  let page = 0;
  let loads = 0;

  async function post(url, body, what) {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!response.ok) alert(`The ${what} failed: ${response.status}`);
    return response.ok;
  }

  const mark = (id, body) => post(`api/interactions/${id}/mark`, body, 'mark');

  // A pick moves the voice sample of the request at once. The list stays disabled until the
  // server answers, so an earlier pick cannot overwrite a later one.
  function pickSpeaker(speaker, interaction) {
    if (!interaction.satellite) {
      speaker.remove();
      return;
    }
    speaker.append(...people.map((person) => new Option(person.name, person.entity)));
    speaker.value = interaction.speaker ?? '';
    speaker.addEventListener('change', async () => {
      speaker.disabled = true;
      await post(`api/interactions/${interaction.id}/speaker`,
        { person: speaker.value || null }, 'speaker pick').finally(() => { speaker.disabled = false; });
    });
  }

  function press(row, value) {
    row.querySelector('.mark-good').setAttribute('aria-pressed', String(value === 'Good'));
    row.querySelector('.mark-bad').setAttribute('aria-pressed', String(value === 'Bad'));
  }

  function rate(row, id, current, marked) {
    press(row, current?.value);
    for (const [name, value] of [['good', 'Good'], ['bad', 'Bad']]) {
      row.querySelector(`.mark-${name}`).addEventListener('click', async () => {
        const body = { value: name, correction: null };
        if (await mark(id, body)) {
          press(row, value);
          marked(value);
        }
      });
    }
  }

  function card(interaction) {
    const shown = document.getElementById('interaction').content.cloneNode(true);
    const field = (name) => shown.querySelector(`.${name}`);
    field('time').textContent = new Date(interaction.time).toLocaleString();
    field('satellite').textContent = interaction.satellite ?? 'typed';
    field('transcript').textContent = interaction.transcript;
    pickSpeaker(field('speaker'), interaction);
    shown.querySelector('audio').src = `api/interactions/${interaction.id}/audio`;
    field('intent').textContent = [interaction.action.intent, ...interaction.action.targets].join(' ');
    const action = interaction.marks[0];
    const correction = field('correction');
    correction.append(...intents.map((name) => new Option(name)));
    correction.value = action?.correction ?? '';
    correction.hidden = action?.value !== 'Bad';
    correction.addEventListener('change', () => mark(interaction.id,
      { value: 'bad', correction: correction.value || null }));
    rate(field('action'), interaction.id, action, (value) => {
      correction.hidden = value !== 'Bad';
      correction.value = '';
    });
    const template = document.getElementById('response').content.firstElementChild;
    for (const response of interaction.responses) {
      const row = template.cloneNode(true);
      row.querySelector('.text').textContent = response.text;
      field('responses').append(row);
    }
    return shown;
  }

  async function fetchPage(kept, number) {
    const response = await fetch(`api/interactions?filter=${kept}&page=${number}`);
    if (!response.ok) throw new Error(`status ${response.status}`);
    return response.json();
  }

  // Loads the first page, or with `next` every page up to one more than before. A mark can move
  // an interaction out of the Bad filter, so the pages load again instead of from an old offset.
  // Only the newest load shows its result, so a slow earlier load cannot replace it.
  async function load(next) {
    const ticket = (loads += 1);
    const kept = filter.value === 'bad' ? 'bad' : 'all';
    const unmarked = filter.value === 'unmarked';
    const wanted = next === true ? page + 1 : 0;
    try {
      const interactions = [];
      let last = [];
      for (let number = 0; number <= wanted; number += 1) {
        last = await fetchPage(kept, number);
        interactions.push(...last);
      }
      if (ticket !== loads) return;
      page = wanted;
      const shown = interactions.filter((each) => !unmarked || each.marks.length === 0);
      list.replaceChildren(...shown.map(card));
      more.hidden = last.length === 0;
    } catch (error) {
      if (ticket !== loads) return;
      list.textContent = `Jarvis did not answer: ${error.message}`;
      more.hidden = true;
    }
  }

  // A learned intent with a service waits for your approval.
  function proposal(entry) {
    const shown = document.getElementById('proposal').content.firstElementChild.cloneNode(true);
    shown.querySelector('.name').textContent = entry.name;
    shown.querySelector('.service').textContent = entry.service;
    shown.querySelector('.examples').append(...entry.examples.map((example) =>
      Object.assign(document.createElement('li'), { textContent: example })));
    for (const [name, approve] of [['approve', true], ['reject', false]]) {
      shown.querySelector(`.${name}`).addEventListener('click', async () => {
        if (await post(`api/proposals/${encodeURIComponent(entry.name)}`, { approve }, name)) shown.remove();
      });
    }
    return shown;
  }

  async function loadProposals() {
    const response = await fetch('api/proposals');
    if (response.ok) document.getElementById('proposals').replaceChildren(...(await response.json()).map(proposal));
  }

  async function start() {
    const [found, listed] = await Promise.all([fetch('api/intents'), listedPeople]);
    if (found.ok) intents = await found.json();
    people = listed;
    filter.addEventListener('change', () => load(false));
    more.addEventListener('click', () => load(true));
    await load(false);
  }

  async function currentStatus() {
    // The signal also bounds the body read, and ends before the next poll starts.
    const response = await fetch('api/status', { signal: AbortSignal.timeout(4000) });
    if (!response.ok) throw new Error(`status ${response.status}`);
    return response.json();
  }

  // After a save, the section shows `restarting` until a status asked after the save is online.
  let restarting = false;
  let saves = 0;

  async function showStatus() {
    const asked = saves;
    const shown = await currentStatus().catch(() => ({ state: 'offline', message: null }));
    if (asked === saves) restarting &&= shown.state !== 'online';
    statusSection.dataset.state = restarting ? 'restarting' : shown.state;
    statusSection.querySelector('.state').textContent = statusSection.dataset.state;
    statusSection.querySelector('.message').textContent = shown.message ?? '';
  }

  const settingsForm = document.getElementById('settings');
  const settingsError = document.getElementById('settings-error');
  let settings = [];

  function input(setting) {
    if (Array.isArray(setting.value)) {
      const area = document.createElement('textarea');
      area.value = setting.value.join('\n');
      area.rows = setting.value.length + 1;
      return area;
    }
    const field = document.createElement('input');
    field.type = typeof setting.value === 'number' ? 'number' : 'text';
    field.step = 'any';
    field.value = String(setting.value);
    return field;
  }

  // The "Address as" field of the person of `setting`.
  function personField(setting) {
    const row = document.getElementById('person').content.firstElementChild.cloneNode(true);
    row.querySelector('.name').textContent = setting.person;
    Object.assign(row.querySelector('.address'), { name: setting.name, value: setting.value });
    return row;
  }

  // The value of the form field of `setting`, with the type of its old value.
  function edited(setting) {
    const text = settingsForm.elements.namedItem(setting.name).value;
    if (Array.isArray(setting.value)) return text.split('\n').map((line) => line.trim()).filter(Boolean);
    return typeof setting.value === 'number' ? Number(text) : text;
  }

  async function loadSettings() {
    const response = await fetch('api/settings');
    if (!response.ok) {
      settingsError.textContent = `The settings did not load: ${response.status}`;
      return;
    }
    const loaded = await response.json();
    // One `People` field for each person, also with no form of address yet.
    const addresses = (await listedPeople).map((person) => {
      const name = `address.${person.entity}`;
      const value = loaded.find((setting) => setting.name === name)?.value ?? '';
      return { group: 'People', name, value, person: person.name };
    });
    settings = [...loaded.filter((setting) => setting.group !== 'People'), ...addresses];
    const groups = new Map();
    for (const setting of settings) {
      if (!groups.has(setting.group)) {
        const fieldset = document.createElement('fieldset');
        fieldset.append(Object.assign(document.createElement('legend'), { textContent: setting.group }));
        groups.set(setting.group, fieldset);
      }
      if (setting.person !== undefined) {
        groups.get(setting.group).append(personField(setting));
        continue;
      }
      const label = document.createElement('label');
      const field = Object.assign(input(setting), { name: setting.name });
      label.append(`${setting.name} `, field);
      groups.get(setting.group).append(label);
    }
    document.getElementById('fields').replaceChildren(...groups.values());
  }

  // Sends only the changed fields.
  settingsForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const changed = settings.filter((setting) =>
      JSON.stringify(edited(setting)) !== JSON.stringify(setting.value));
    const body = Object.fromEntries(changed.map((setting) => [setting.name, edited(setting)]));
    const response = await fetch('api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (response.ok) {
      settingsError.textContent = '';
      saves += 1;
      restarting = true;
      while (restarting) {
        await Promise.all([showStatus(), new Promise((resolve) => setTimeout(resolve, 1000))]);
      }
      await loadSettings();
      return;
    }
    const refusal = await response.json().catch(() => ({ error: `status ${response.status}` }));
    settingsError.textContent = refusal.error;
  });

  // Inside HA ingress the page has the origin of the HA page around it, so it can take the theme
  // values and the fonts of that page. A direct visit keeps the defaults.
  const THEME = ['--primary-color', '--text-primary-color', '--primary-text-color',
    '--secondary-text-color', '--primary-background-color', '--card-background-color',
    '--ha-card-background', '--divider-color', '--input-fill-color', '--success-color',
    '--warning-color', '--error-color', '--ha-card-border-radius', '--ha-font-family-body',
    '--app-header-background-color', '--app-header-text-color'];

  function rules(sheet) {
    try {
      return [...sheet.cssRules];
    } catch {
      return [];
    }
  }

  function copyTheme(outer) {
    const style = getComputedStyle(outer.documentElement);
    for (const name of THEME) {
      const value = style.getPropertyValue(name).trim();
      if (value) document.documentElement.style.setProperty(name, value);
      else document.documentElement.style.removeProperty(name);
    }
  }

  function followTheme() {
    let outer;
    try {
      outer = window.parent.document;
    } catch {
      return;
    }
    if (outer === document) return;
    copyTheme(outer);
    // HA writes its theme into the style of its root element, also on a light or dark change.
    new MutationObserver(() => copyTheme(outer)).observe(outer.documentElement, { attributes: true });
    const sheets = [...outer.styleSheets, ...outer.adoptedStyleSheets];
    const faces = sheets.flatMap(rules).filter((rule) => rule.constructor.name === 'CSSFontFaceRule');
    document.head.append(Object.assign(document.createElement('style'),
      { textContent: faces.map((rule) => rule.cssText).join('\n') }));
  }

  for (const tab of document.querySelectorAll('[role="tab"]')) {
    tab.addEventListener('click', () => {
      for (const other of document.querySelectorAll('[role="tab"]')) {
        other.setAttribute('aria-selected', String(other === tab));
        document.getElementById(other.dataset.panel).hidden = other !== tab;
      }
    });
  }

  followTheme();
  loadSettings();
  showStatus();
  setInterval(showStatus, 5000);
  loadProposals();
  start();
</script>
</body>
</html>
